[project]
name = "nyayaos"
version = "0.1.0"
description = "NyayaOS — An Agentic AI Legal Operating System powered by Gemma"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "prometheus-client>=0.20",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "greenlet>=3.0",
    "google-genai>=1.0",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    "langgraph>=0.6",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain-core>=0.3",
    "langchain-ollama>=0.2",
    "langchain-openai>=0.2",
    "psycopg[binary]>=3.1",
    "langchain-chroma>=0.2",
    "chromadb>=1.0",
    "langchain-text-splitters>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "ruff>=0.5",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "langgraph-checkpoint-sqlite>=2.0",
]
otel = [
    "opentelemetry-exporter-otlp-proto-http>=1.25",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# pytest fixture parameters (capsys, monkeypatch, ...) are conventionally
# left unannotated; strict "no-untyped-def" on test functions adds noise
# without catching real bugs here. Test *bodies* are still fully type-checked.
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
